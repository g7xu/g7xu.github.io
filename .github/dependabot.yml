version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this is what proposes the bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch bumps; majors still arrive individually.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
